name: "claudia"
description: "Diff-aware post-deploy test agent — posts a test plan as a sticky PR comment"
author: "claudia"

inputs:
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: ${{ github.token }}
  base:
    description: "Base ref to diff against"
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: "Head ref to diff to"
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  target-url:
    description: "Deployed preview URL"
    required: false
  model:
    description: "Override the planner model"
    required: false
  cwd:
    description: "Project root directory"
    required: false
    default: "."

outputs:
  verdict:
    description: "test or skip"
  plan-json:
    description: "Plan as JSON string"

runs:
  using: "node20"
  main: "dist/index.js"

branding:
  icon: "check-circle"
  color: "purple"
