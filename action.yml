name: "claudia"
description: "Diff-aware post-deploy test agent — posts a test plan as a sticky PR comment"
author: "claudia"

inputs:
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: ${{ github.token }}
  base:
    description: "Base ref to diff against"
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: "Head ref to diff to"
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  target-url:
    description: "Deployed preview URL"
    required: false
  model:
    description: "Override the planner model"
    required: false
  cwd:
    description: "Project root directory"
    required: false
    default: "."
  mode:
    description: "Trust gradient: shadow (comment only, default), advisory (comment + neutral PR check), or gating (comment + check that fails when blocking-risk threshold is hit). Gating requires `permissions: checks: write` in the consuming workflow."
    required: false
    default: "shadow"
  blocking-risk:
    description: "In gating mode, the minimum flow risk that fails the check: low | medium | high. Default high."
    required: false
    default: "high"

outputs:
  verdict:
    description: "test or skip"
  plan-json:
    description: "Plan as JSON string"
  check-conclusion:
    description: "In advisory/gating mode: the conclusion of the posted check (success | failure | neutral). Empty in shadow mode."

runs:
  using: "node20"
  main: "packages/github-action/dist/index.js"

branding:
  icon: "check-circle"
  color: "purple"
