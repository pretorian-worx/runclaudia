name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Using a fine-grained PAT instead of GITHUB_TOKEN because the
          # pretorian-worx org policy blocks Actions-issued tokens from
          # creating pull requests. The PAT acts as the user and bypasses
          # that policy. Permissions on the token: Contents r/w, PRs r/w,
          # scoped to runclaudia only.
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  move-major-tag:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move v${{ needs.release-please.outputs.major }} major-version tag
        run: |
          MAJOR_TAG="v${{ needs.release-please.outputs.major }}"
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" "$TAG_NAME" -m "$MAJOR_TAG → $TAG_NAME"
          git push --force origin "$MAJOR_TAG"

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Publish core first so the CLI's `workspace:^` dependency resolves to
      # the just-published version. --no-git-checks because release-please
      # already committed the version bump; the tree is otherwise clean here.
      - run: pnpm --filter @pretorian-worx/runclaudia-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm --filter @pretorian-worx/runclaudia-cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
